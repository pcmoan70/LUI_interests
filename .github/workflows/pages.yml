name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Version asset and data URLs (cache busting)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__v = \"dev\"/__v = \"$V\"/; s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#href=\"styles.css\"#href=\"styles.css?v=$V\"#" web/index.html
          grep -o '__v = "[^"]*"' web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
